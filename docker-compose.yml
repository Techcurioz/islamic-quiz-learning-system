services:
  postgres:
    image: postgres:16-alpine
    container_name: islamic-quiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quiz_user
      POSTGRES_PASSWORD: quiz_password
      POSTGRES_DB: islamic_quiz
    ports:
      - "5432:5432"
    volumes:
      - islamic_quiz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz_user -d islamic_quiz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  islamic_quiz_pgdata:
